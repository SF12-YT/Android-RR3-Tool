name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source and Monkey Tool submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build components
        run: |
          sdkmanager "platforms;android-37" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-rr3-tool-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
