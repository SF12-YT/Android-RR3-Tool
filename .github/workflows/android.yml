name: Android build

on:
  push:
    branches: [main, feature/continuous-text-editor, feature/livery-nct-data-view]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_preview:
        description: "Publish the built APK as a prerelease in this private repository"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source and Monkey Tool submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Create explicit debug signing key
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/rr3tool-debug.keystore" \
            -storepass android \
            -alias rr3tooldebug \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=RR3 Tool Debug,O=SF12-YT,C=AU"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build components
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Verify APK signature and alignment
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -v 4 "$APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rr3-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3

      - name: Package APK for round-trip verification
        if: (github.event_name == 'workflow_dispatch' && inputs.publish_preview == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-apk]'))
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          sha256sum "$APK"
          zip -q -j app-debug-apk.zip "$APK"

      - name: Publish verified preview APK
        if: (github.event_name == 'workflow_dispatch' && inputs.publish_preview == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-apk]'))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="android-preview-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" app/build/outputs/apk/debug/app-debug.apk app-debug-apk.zip \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --title "Android RR3 Tool preview $GITHUB_RUN_NUMBER" \
            --notes "Preview APK built from commit $GITHUB_SHA. APK and ZIP are round-trip checked by CI."

      - name: Download and verify published APK assets
        if: (github.event_name == 'workflow_dispatch' && inputs.publish_preview == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-apk]'))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="android-preview-${GITHUB_RUN_NUMBER}"
          mkdir -p release-download
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern "app-debug.apk" --pattern "app-debug-apk.zip" \
            --dir release-download

          ORIGINAL="app/build/outputs/apk/debug/app-debug.apk"
          DOWNLOADED="release-download/app-debug.apk"
          cmp "$ORIGINAL" "$DOWNLOADED"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$DOWNLOADED"

          unzip -p "release-download/app-debug-apk.zip" app-debug.apk > release-download/from-zip.apk
          cmp "$ORIGINAL" "release-download/from-zip.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose release-download/from-zip.apk
